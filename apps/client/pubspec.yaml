# VeilVPN client — Flutter app (Windows, Android, macOS first; iOS + Linux later).
# Direct downloads via GitHub Releases ($0 budget: no store deployments).
# Build flavors via --dart-define:
#   FLAVOR=direct|play|macstore   (default: direct)
#   API_BASE_URL=https://api.veil.example
#   GITHUB_REPO=owner/veil-vpn    (for the in-app update checker)
name: veil_client
description: VeilVPN no-logs VPN client.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  tray_manager: ^0.5.2
  window_manager: ^0.4.3
  in_app_purchase: ^3.2.0
  win32: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# Brand icons: master mark at assets/icon/icon.png (generated by
# tools/make_logo.py). Release CI runs `dart run flutter_launcher_icons`
# after generating the platform shells, so every platform ships the real
# VeilVPN icon instead of the default Flutter one.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
