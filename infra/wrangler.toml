# VeilVPN API — Cloudflare Worker (wrangler.toml)
# Full Worker code lands in apps/api in Phase 2. This file pins the
# bindings, vars, and cron schedules Phase 2+ must follow.
#
# Secrets are NEVER committed here. Set each with:
#   wrangler secret put <NAME>
# (see apps/api/.env.example for the full list and descriptions)

name = "veil-api"
# Entry point is apps/api/src/index.ts (config lives here in infra/).
main = "../apps/api/src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
# route = { pattern = "api.veil.example/*", zone_name = "veil.example" }  # set when custom domain is live

# ---- D1: primary relational store ----
[[d1_databases]]
binding = "DB"
database_name = "veil-vpn-db"
database_id = "100ee368-cf3b-4c91-9c7f-13d9e714a38f"
migrations_dir = "d1/migrations"

# ---- KV: rate limiting buckets + short-lived caches ----
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "b5746582c1b7477d95b08c19c8064d31"

# ---- Public (non-secret) vars ----
[vars]
ADMIN_LOGIN_SIMPLE = "true"
# Google sign-in (enabled 2026-10-20; project veilvpn-app, consent in
# Testing mode with luisswift123@gmail.com as test user).
GOOGLE_SIGNIN_ENABLED = "true"
# Workers fetch() refuses bare-IP URLs (403 error 1003), so agent calls go
# through this free DuckDNS name for the Hyderabad node (same IP).
NODE_AGENT_HOST_MAP = "140.245.224.114=veilhyd1.duckdns.org"
GOOGLE_OAUTH_CLIENT_IDS = "855470494126-2q6jpq8pdk2ofcum386n78ft65lmvg8n.apps.googleusercontent.com,855470494126-v2h0pcdguf0kd7o3n5ng1cp8egkqifkp.apps.googleusercontent.com,855470494126-inc4ib8gjjen74tkk5ghn5f5j87m3c8e.apps.googleusercontent.com"
APP_NAME = "VeilVPN"
APP_ENV = "production"
APP_URL = "https://veil-vpn-site.vercel.app"
API_PUBLIC_URL = "https://veil-api.luisswift123.workers.dev"
ADMIN_URL = "https://veil-vpn-admin.vercel.app"
JWT_ISSUER = "veil-api"
# ACCESS_TOKEN_TTL_SECONDS = "900"          # 15 min
# REFRESH_TOKEN_TTL_SECONDS = "2592000"    # 30 days

# ---- Crons ----
# every 15 min: expire peers, sweep used/expired email tokens, revoke expired refresh tokens
# hourly: subscription lifecycle (trial expiry, grace, past_due), audit-log checkpoint
[triggers]
crons = ["*/15 * * * *", "0 * * * *"]
